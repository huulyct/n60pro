name: Build ImmortalWrt BE12 Pro

on:
  workflow_dispatch:
  # Bỏ comment 2 dòng dưới nếu muốn tự động chạy khi push file .config
   push:
     paths:
       - '.config'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_SH: diy-part1.sh
  DIY_SH2: diy-part2.sh
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space & Install dependencies (Ubuntu 24.04 Safe)
        run: |
          # Giải phóng dung lượng an toàn, KHÔNG xóa ubuntu.sources của Ubuntu 24.04
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          
          # Chỉ xóa các PPA bên thứ 3 gây chậm update, giữ nguyên ubuntu.sources gốc
          sudo find /etc/apt/sources.list.d/ -type f ! -name 'ubuntu.sources' -delete
          
          sudo apt-get update -y
          
          # Danh sách gói chuẩn cho OpenWrt/ImmortalWrt trên Ubuntu 24.04 + hỗ trợ build gn/ninja
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev \
            gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            liburing-dev libyaml-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-pyelftools python3-setuptools qemu-utils \
            quilt rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

          sudo apt-get autoremove --purge -y
          sudo apt-get clean
          df -h

      - name: Clone ImmortalWrt Source Code
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH immortalwrt

      - name: Load custom feeds (Optional)
        run: |
          if [ -f "$DIY_SH" ]; then
            chmod +x $DIY_SH
            cd immortalwrt && ../$DIY_SH
          fi

      - name: Update & Install Feeds
        working-directory: ./immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom Configuration & Scripts
        run: |
          if [ -d "files" ]; then
            cp -r files immortalwrt/files
          fi
          if [ -f "$CONFIG_FILE" ]; then
            cp $CONFIG_FILE immortalwrt/.config
          fi
          if [ -f "$DIY_SH2" ]; then
            chmod +x $DIY_SH2
            cd immortalwrt && ../$DIY_SH2
          fi

      - name: Download Packages
        working-directory: ./immortalwrt
        run: |
          make defconfig
          make download -j8
          # Xóa các file tải lỗi (dưới 1KB) để tránh lỗi giải nén ở bước compile
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Pre-build Host Tools (Fix gn & ninja host build)
        working-directory: ./immortalwrt
        run: |
          echo "=== Building host tools & gn first ==="
          make tools/compile -j$(nproc) || make tools/compile -j1 V=s
          if grep -q "CONFIG_PACKAGE_gn=y\|CONFIG_PACKAGE_naiveproxy=y" .config 2>/dev/null || [ -d "feeds/packages/devel/gn" ]; then
            make package/feeds/packages/ninja/host/compile -j$(nproc) || make package/feeds/packages/ninja/host/compile -j1 V=s
            make package/feeds/packages/gn/host/compile -j$(nproc) || make package/feeds/packages/gn/host/compile -j1 V=s
          fi

      - name: Compile Firmware
        working-directory: ./immortalwrt
        run: |
          echo "=== Starting Full Compilation with $(nproc) threads ==="
          make -j$(nproc) || make -j1 V=s
          echo "=== Disk Space After Build ==="
          df -h

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: ImmortalWrt_N60Pro_Firmware
          path: |
            immortalwrt/bin/targets/*/*/*.bin
            immortalwrt/bin/targets/*/*/*.itb
            immortalwrt/bin/targets/*/*/*.img.gz
            immortalwrt/bin/targets/*/*/sha256sums
          if-no-files-found: ignore
