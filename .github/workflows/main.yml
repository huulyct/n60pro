name: Build ImmortalWrt (Debian 11)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master # Hoặc openwrt-23.05, openwrt-24.10 tùy nhu cầu
  CONFIG_FILE: .config

jobs:
  build:
    runs-on: ubuntu-latest
    # Khởi chạy môi trường Debian 11 (Bullseye)
    container:
      image: debian:bullseye
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Khởi tạo user và cấp quyền sudo (Bắt buộc trên Debian container)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update -y
        apt-get install -y sudo
        # Tạo user 'builder' để không bị lỗi compile bằng quyền root của OpenWrt
        useradd -m -s /bin/bash builder
        echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
        chown -R builder:builder $GITHUB_WORKSPACE

    - name: Cài đặt các gói theo khuyến nghị của ImmortalWrt
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        su builder -c "
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz genisoimage msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt autoremove --purge -y
          sudo apt clean
        "

    - name: Clone mã nguồn ImmortalWrt
      run: |
        su builder -c "git clone --depth 1 $REPO_URL -b $REPO_BRANCH immortalwrt"

    - name: Update & Install feeds
      working-directory: ./immortalwrt
      run: |
        su builder -c "
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        "

    - name: Nạp script uci-defaults (PPPoE, WireGuard, Wi-Fi, DoH, mwan3)
      run: |
        su builder -c "
          if [ -d 'files' ]; then
            mkdir -p immortalwrt/files
            cp -r files/* immortalwrt/files/
            chmod +x immortalwrt/files/etc/uci-defaults/*
            echo 'Đã nạp thành công uci-defaults.'
          fi
        "

    - name: Nạp file .config và các gói bổ sung
      run: |
        su builder -c "
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE immortalwrt/.config
          cd immortalwrt
          
          # Gói WireGuard
          echo 'CONFIG_PACKAGE_kmod-wireguard=y' >> .config
          echo 'CONFIG_PACKAGE_luci-proto-wireguard=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-wireguard=y' >> .config
          echo 'CONFIG_PACKAGE_wireguard-tools=y' >> .config
          
          # Gói DoH & Dnsmasq-full
          echo 'CONFIG_PACKAGE_https-dns-proxy=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-https-dns-proxy=y' >> .config
          echo 'CONFIG_PACKAGE_dnsmasq=m' >> .config
          echo 'CONFIG_PACKAGE_dnsmasq-full=y' >> .config
          
          # Gói hỗ trợ WPA3 (nếu .config gốc chưa chọn)
          echo 'CONFIG_PACKAGE_wpad-openssl=y' >> .config
          
          make defconfig
        "

    - name: Tải xuống các gói phụ thuộc (Download packages)
      working-directory: ./immortalwrt
      run: |
        su builder -c "
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;
        "

    - name: Biên dịch Firmware (Compile)
      working-directory: ./immortalwrt
      run: |
        su builder -c "
          echo 'Bắt đầu compile với $(nproc) luồng trên Debian 11...'
          make -j$(nproc) || make -j1 || make -j1 V=s
        "

    - name: Upload Firmware hoàn chỉnh
      uses: actions/upload-artifact@v5
      with:
        name: ImmortalWrt_Firmware_Debian11
        path: immortalwrt/bin/targets/
