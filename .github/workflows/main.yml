name: Build ImmortalWrt (Ubuntu Latest)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master # Hoặc nhánh cụ thể như openwrt-23.05, openwrt-24.10
  CONFIG_FILE: .config

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prepare environment (Tối ưu cho Ubuntu 24.04 & chống lỗi gn)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Xóa các repo bên thứ 3 nhưng GIỮ LẠI ubuntu.sources của Ubuntu 24.04
        sudo find /etc/apt/sources.list.d/ -type f ! -name 'ubuntu.sources' -delete
        
        # Giải phóng dung lượng ổ cứng của runner
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        # Cập nhật và cài đặt các gói phụ thuộc đã chuẩn hóa cho Ubuntu 24.04
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev python3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev zlib1g-dev lld llvm lrzsz genisoimage msmtp nano \
          ninja-build generate-ninja p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
          python3-docutils python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zstd
          
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone ImmortalWrt source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH immortalwrt

    - name: Update, Install feeds & Fix gn build error
      working-directory: ./immortalwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # Vá lỗi gói gn bị dừng do cảnh báo -Werror trên trình biên dịch mới của Ubuntu 24.04
        find feeds/ -path "*/gn/Makefile" -exec sed -i 's/ ninja / ninja -v /g' {} + 2>/dev/null || true
        find feeds/ -path "*/gn/Makefile" -exec sed -i '/Host\/Configure/a \	sed -i "s/-Werror/-Wno-error/g" $(HOST_BUILD_DIR)/build/gen.py' {} + 2>/dev/null || true

    - name: Load custom files (Nạp script uci-defaults)
      run: |
        if [ -d "files" ]; then
          mkdir -p immortalwrt/files
          cp -r files/* immortalwrt/files/
          chmod +x immortalwrt/files/etc/uci-defaults/*
          echo "Đã nạp các script uci-defaults và cấp quyền thực thi."
        fi

    - name: Load custom configuration
      run: |
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE immortalwrt/.config
        cd immortalwrt
        
        # Đảm bảo các gói cho WireGuard Client được chọn
        echo "CONFIG_PACKAGE_kmod-wireguard=y" >> .config
        echo "CONFIG_PACKAGE_luci-proto-wireguard=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-wireguard=y" >> .config
        echo "CONFIG_PACKAGE_wireguard-tools=y" >> .config
        
        # Đảm bảo các gói cho DNS-over-HTTPS và Dnsmasq-full được chọn
        echo "CONFIG_PACKAGE_https-dns-proxy=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-https-dns-proxy=y" >> .config
        echo "CONFIG_PACKAGE_dnsmasq=m" >> .config
        echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
        
        # Đảm bảo hỗ trợ mã hóa WPA3-SAE cho Wi-Fi 5GHz
        echo "CONFIG_PACKAGE_wpad-openssl=y" >> .config
        
        make defconfig

    - name: Download packages
      working-directory: ./immortalwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      working-directory: ./immortalwrt
      run: |
        echo -e "Bắt đầu compile với $(nproc) luồng..."
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v5
      with:
        name: ImmortalWrt_Firmware
        path: immortalwrt/bin/targets/
